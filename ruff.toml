line-length = 120
target-version = "py312"

[lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "PTH", "RUF", "S"]
# S603 and S607 flag every subprocess call; the style guide already requires an argument list, and tools are found on
# PATH on purpose.
ignore = ["S603", "S607"]

[lint.per-file-ignores]
"test_*.py" = ["S101"]
