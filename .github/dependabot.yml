version: 2
# One pull request a week carries every ecosystem's updates, so they merge together rather than each waiting on a
# rebase after the one before.
multi-ecosystem-groups:
  weekly:
    schedule:
      interval: weekly
updates:
  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: weekly
    patterns: ["*"]
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /
    multi-ecosystem-group: weekly
    patterns: ["*"]
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: /
    multi-ecosystem-group: weekly
    patterns: ["*"]
    cooldown:
      default-days: 7
