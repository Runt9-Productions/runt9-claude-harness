name: Install Claude Code
description: >-
  Installs the newest Claude Code release as `claude` on the PATH, and with `sandbox` the tools its Bash sandbox needs.

inputs:
  sandbox:
    description: >-
      "true" also installs bubblewrap and socat, for a run with CLAUDE_CODE_SUBPROCESS_ENV_SCRUB set.
    default: "false"

runs:
  using: composite
  steps:
    # Newest release on every run, outside the lockfile: local Claude Code auto-updates, so a check must run the
    # version users have. With scripts off the package's `claude` binary is a stub that exits 1; cli-wrapper.cjs is the
    # package's launcher for that case. The PATH entry is under the runner's temp directory, outside the checkout.
    - name: Install Claude Code
      shell: bash
      working-directory: ${{ runner.temp }}
      run: | # zizmor: ignore[adhoc-packages,github-env] latest on purpose; PATH gains a temp dir
        npm install --prefix "$RUNNER_TEMP/claude" --no-save --no-fund --ignore-scripts @anthropic-ai/claude-code@latest
        mkdir -p "$RUNNER_TEMP/bin"
        printf '#!/bin/sh\nexec node "%s" "$@"\n' \
          "$RUNNER_TEMP/claude/node_modules/@anthropic-ai/claude-code/cli-wrapper.cjs" > "$RUNNER_TEMP/bin/claude"
        chmod +x "$RUNNER_TEMP/bin/claude"
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/bin/claude" --version

    # CLAUDE_CODE_SUBPROCESS_ENV_SCRUB runs Bash in Claude Code's sandbox, which needs bubblewrap, and socat for its
    # network bridge; without socat no Bash command starts. Ubuntu 24.04's AppArmor stops bwrap creating the user
    # namespace it runs in. The last line fails this step, not the review, if bwrap still cannot.
    - name: Install the sandbox's tools
      if: inputs.sandbox == 'true'
      shell: bash
      working-directory: ${{ runner.temp }}
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q bubblewrap socat
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        bwrap --ro-bind / / true
