name: CI

# `gate` is the check branch rules require. Never filter this workflow with paths or paths-ignore: a PR the filter
# excludes never starts it, so `gate` never reports and the PR waits forever. `edited` is listed because changing a
# PR's base branch raises only that event, and the new base needs its own run.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  # zizmor audits this workflow, so every other job waits for it: a flaw it would flag must not run first.
  zizmor:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # zizmor reads a config file it finds in the repo, and outside .github/workflows the bot can write one, so a
      # config could switch audits off without an owner commit.
      - name: No zizmor config file
        shell: bash
        run: |
          configs="$(find . -path ./.git -prune -o -iname '*zizmor*.y*ml' -print)"
          if [[ -n $configs ]]; then
            echo "::error::zizmor would read a config from the repo: $configs"
            exit 1
          fi

      # Online audits are off because they spend API rate limit.
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          online-audits: false
          advanced-security: false
          annotations: true

  guard:
    needs: zizmor
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    # The checkout is GitHub's merge of the PR into its base, so HEAD^1 is the base as it will be merged into and
    # `git diff HEAD^1 HEAD` is exactly what the merge changes, even when the base has moved since the PR forked.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: No invisible characters
        run: bash .github/scripts/guard-invisible-characters.sh

      - name: Marketplace entries only point at plugins/
        run: bash .github/scripts/guard-marketplace-entries.sh

      - name: Every changed plugin, and a changed harness, raises its version
        run: bash .github/scripts/guard-versions.sh

  # shellcheck and the bats tests over every tracked shell script: these workflow scripts and the harness.
  scripts:
    needs: zizmor
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install bats, shellcheck and betterleaks
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bats shellcheck
          bash .github/scripts/install-betterleaks.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: shellcheck
        run: git ls-files -z '*.sh' '*.bash' '*.bats' harness/githooks/pre-commit harness/githooks/pre-merge-commit harness/githooks/pre-push | xargs -0 shellcheck

      # bats passes when it finds no tests, so the files are listed and counted.
      - name: bats
        run: |
          mapfile -d '' tests < <(git ls-files -z '*.bats')
          if (( ${#tests[@]} == 0 )); then
            echo "::error::No .bats files found."
            exit 1
          fi
          bats "${tests[@]}"

  # ruff and pytest over every Python file outside dependency and build directories, at the versions
  # requirements-dev.txt pins.
  python:
    needs: zizmor
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    # Full history, because the knowledge base step reads the PR's commits back to where it forked.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Wheels only, so installing runs no package's build code; pip check fails if the pins stop fitting together.
      - name: Install the pinned tools
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check --no-deps --only-binary :all: \
            -r requirements-dev.txt
          "$RUNNER_TEMP/venv/bin/pip" check
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      # A config file, ignore file or conftest.py that a PR adds could switch a check off and still pass, so ruff reads
      # only ruff.toml and pytest reads no config file and no conftest.py. A shared fixture cannot live in conftest.py.
      - name: ruff check
        run: ruff check --no-cache --config ruff.toml --no-respect-gitignore .

      - name: ruff format
        run: ruff format --check --no-cache --config ruff.toml --no-respect-gitignore .

      # pytest exits 5 when it collects no tests, so a run that finds none fails. -P keeps the checkout off sys.path, so
      # a pytest.py in it cannot stand in for pytest. The default norecursedirs skips every hidden directory, .github
      # included, so the override keeps only .git and node_modules out.
      - name: pytest
        run: python -P -m pytest -p no:cacheprovider -c /dev/null --rootdir . --noconftest -o 'norecursedirs=.git node_modules'

      # A root that moved or emptied fails, since the validator exits 2 when it finds no notes.
      - name: Knowledge base validates
        run: python plugins/reference-kb/skills/reference-kb/scripts/validate.py --root .claude/reference

      # In the merge checkout HEAD^1 is the base and HEAD^2 the PR's head, so the range is the PR's own commits: a note
      # fails when the PR changes its sources without moving `verified`, not for staleness it inherited. Skipped for
      # Dependabot, whose pin bumps change sources such as this file without touching what a note says, and which
      # cannot edit the notes.
      - name: Knowledge base notes are re-verified when their sources change
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        run: |
          python plugins/reference-kb/skills/reference-kb/scripts/validate.py --root .claude/reference \
            --stale-in HEAD^1..HEAD^2

  leak-scan:
    needs: zizmor
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install betterleaks
        run: |
          bash .github/scripts/install-betterleaks.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Scan the PR's commits
        run: bash .github/scripts/leak-scan-pr.sh

  plugins:
    needs: zizmor
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install the pinned tools
        run: npm ci

      # The PR's own copy, since this job holds no secret: a change to the action runs here before it reaches a review.
      - uses: $/.github/actions/install-claude-code

      - name: Every plugin validates strictly
        run: |
          shopt -s nullglob
          status=0
          for dir in plugins/*/; do
            claude plugin validate --strict "$dir" || status=1
            # The mod step finds a mod only at hooks/hooks.json, so one that `hooks` in plugin.json points elsewhere
            # would pass unchecked.
            if jq -e 'has("hooks")' "$dir.claude-plugin/plugin.json" > /dev/null; then
              echo "::error::${dir}.claude-plugin/plugin.json sets hooks; keep them in hooks/hooks.json so the mod is checked."
              status=1
            fi
          done
          exit "$status"

      # Loading a mod writes its types and tsconfig.json; with no credentials the run then fails, which is expected.
      # That `-p` writes them is undocumented, and type-aware oxlint passes silently without them, so their absence
      # fails the step.
      - name: Every mod type-checks, lints and passes its tests
        run: |
          shopt -s nullglob
          status=0
          for hooks in plugins/*/hooks/hooks.json; do
            jq -e '.modules' "$hooks" > /dev/null || continue
            dir="${hooks%/hooks/hooks.json}"
            echo "::group::$dir"
            CLAUDE_CODE_PLUGIN_DIR_WATCH=1 timeout 120 claude -p --plugin-dir "$dir" x > /dev/null 2>&1 || true
            if [[ -f $dir/tsconfig.json && -d $dir/.claude-plugin/types ]]; then
              npx --no-install tsc -p "$dir" || status=1
              npx --no-install oxlint -c .oxlintrc.json "$dir" || status=1
            else
              echo "::error::$dir: Claude Code wrote no types, so the mod cannot be type-checked."
              status=1
            fi
            claude plugin test "$dir" || status=1
            echo "::endgroup::"
          done
          exit "$status"

  # Runs even when a job it needs failed: with a plain `needs` this job would be skipped, and GitHub passes a
  # skipped required check.
  gate:
    needs: [zizmor, guard, scripts, python, leak-scan, plugins]
    if: always()
    runs-on: ubuntu-24.04

    steps:
      - name: Fail if any needed job failed or was cancelled
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          if [[ " $RESULTS " == *" failure "* || " $RESULTS " == *" cancelled "* ]]; then
            exit 1
          fi
